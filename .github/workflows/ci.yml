name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]" -c ci/constraints/langgraph-1.2.11.txt
      - name: Ruff lint
        run: ruff check src tests examples
      - name: Ruff format
        run: ruff format --check src tests examples
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -v --cov=agenomic --cov-fail-under=85
      - name: Run offline examples
        if: matrix.os != 'windows-latest'
        run: |
          python examples/01_minimal_trace.py > /dev/null
          python examples/02_decorator_jsonl.py > /dev/null
          python examples/03_atep_local.py > /dev/null
          python examples/05_langgraph_traced.py > /dev/null
          python examples/07_offline_signed_release.py > /dev/null
          python examples/12_managed_prompts_stategraph.py > /dev/null
          python examples/13_langgraph_subagent_prompts.py > /dev/null
          python examples/14_langgraph_async_streaming.py > /dev/null
          python examples/15_langgraph_interrupt_restart.py > /dev/null
          python examples/16_langgraph_promotion_pinning.py > /dev/null

  langgraph-floor:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]" -c ci/constraints/langgraph-1.0.10.txt
      - name: Pytest
        shell: bash
        run: |
          candidates=(tests/test_langgraph_binding_*.py tests/test_experiments_counterfactual.py tests/test_examples.py)
          files=()
          for f in "${candidates[@]}"; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          pytest "${files[@]}" --no-cov

  langgraph-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]" "langgraph<2" "langchain-core<2"
      - name: Report versions
        run: python -m pip show langgraph langgraph-checkpoint langgraph-prebuilt langgraph-sdk langchain-core langgraph-checkpoint-sqlite
      - name: Pytest
        run: pytest -q --no-cov
